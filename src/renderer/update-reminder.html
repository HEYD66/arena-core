<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>千面 Facet 有新版本</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="exit-dialog.css"><script src="update-reminder.js" defer></script></head>
<body><main class="exit-card" role="dialog" aria-modal="true" aria-labelledby="reminderTitle">
 <header class="exit-top"><span>千面 <span class="exit-brand">FACET</span></span><button class="icon-btn" type="button" data-update-reminder="later" aria-label="稍后提醒">×</button></header>
